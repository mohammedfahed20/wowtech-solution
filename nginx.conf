# Site configuration for the Docker image (copied to /etc/nginx/conf.d/default.conf).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Redirects such as /ar -> /ar/ stay relative, so they keep https behind a proxy.
    absolute_redirect off;

    # Compress text files (nginx does not do this by default).
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # HTML, CSS and JS: browsers re-check with the server (fast 304) so updates show immediately.
    location ~* \.(?:html|css|js|json|xml|txt|webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Images and icons: cache for a week.
    location ~* \.(?:png|jpe?g|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
